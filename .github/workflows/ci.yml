name: Python App CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop,main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     service: [frontend, backend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ./frontend/requirements.txt
          pip install -r ./backend/requirements.txt
          pip install -r ./backend-test-project/requirements.txt
          
      - name: Validate Python syntax
        run: python -m compileall -q ${{ matrix.service }}

# Step 2: Log in to Docker Hub using stored secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: nileshrathod17/workspace:frontend

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-test-project
          file: ./backend-test-project/Dockerfile
          push: true
          tags: nileshrathod17/workspace:backend


      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: nileshrathod17/workspace:backend          

      # - name: Build and push
